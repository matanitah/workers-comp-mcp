[project]
name = "workers-comp-mcp"
version = "0.1.0"
description = "FastMCP server for state workers' compensation regulations and reimbursement records."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi",
    "fastmcp",
    "pypdf",
    "pyyaml",
]

[dependency-groups]
dashboard = [
    "streamlit>=1.66.1",
]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
